# Dependabot opens at most one pull request a month per ecosystem, with every update of that
# ecosystem grouped in it. Security alerts are separate and stay on.
#
# The public repository is a mirror: do not merge these pull requests on GitHub. Land the change in
# the private repository and release it, then close the pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # The types follow the oldest Node version Moontide supports (see engines in package.json), not
      # the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # acorn is pinned with its integrity hash in page/index.html; the page and package.json move together
      # by hand.
      - dependency-name: acorn
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
