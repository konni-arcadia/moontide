# This workflow runs the type check and the full test suite on three operating systems and two
# Node versions, for every push to a branch and every pull request. A tag push runs only the
# release workflow, which runs the tests itself. The real-browser checks are not run here: they
# need a browser and network access, and stay hand checks.
#
# Every action reference is a full commit SHA with its version as a comment. Do not use a tag or
# a branch name: a tag can be moved, a commit cannot.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The job name is the check name. Keep it stable: the main-branch rules list these names.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        node: ['22', '24']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
